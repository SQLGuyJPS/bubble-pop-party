<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mic test">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mic test</title>
<style>
@font-face { font-family: 'Andika'; src: url('../fonts/Andika-Bold.ttf') format('truetype'); font-weight: 700; }
html, body { margin: 0; min-height: 100%; font-family: Andika, system-ui, sans-serif; font-weight: 700; color: #1d2b64;
  background: #e6f8ff; -webkit-text-size-adjust: 100%; }
#main { max-width: 900px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 20px 40px; box-sizing: border-box; }
h1 { margin: 0 0 12px; font-size: 34px; }
h2 { margin: 22px 0 6px; font-size: 26px; }
p, li { font-size: 21px; line-height: 1.35; margin: 0 0 12px; }
button { font: inherit; font-size: 21px; color: #1d2b64; background: #ffe066; border: 4px solid #1d2b64; border-radius: 16px;
  padding: 10px 20px; margin: 4px 8px 4px 0; cursor: pointer; touch-action: manipulation; }
button.sel { background: #8be0b0; }
button.big { font-size: 28px; padding: 14px 34px; }
button:disabled { opacity: 0.35; }
.list button { display: block; width: 100%; text-align: left; margin: 0 0 10px; }
.status { padding: 10px 16px; border-radius: 12px; font-size: 24px; }
.status.ok { background: #c9f2d9; }
.status.check { background: #ffd9a8; }
b.ok { color: #13804a; }
b.check { color: #b35300; }
.measured { font-size: 18px; background: #fff; border-radius: 12px; padding: 10px 14px; }
.small { margin-top: 24px; }
.say { font-size: 40px; }
.dot { color: #e53935; }
.meter { height: 34px; border: 4px solid #1d2b64; border-radius: 12px; background: #fff; overflow: hidden; margin: 0 0 16px; }
.meter div { height: 100%; background: #4caf50; }
/* Results: one screen, large, high-contrast text, so a screenshot or photo records everything */
html.results, html.results body { background: #fff; }
html.results #main { max-width: none; padding-top: max(12px, env(safe-area-inset-top)); }
#results { font-size: clamp(16px, 2.25vw, 26px); line-height: 1.22; color: #000; }
.line { display: flex; gap: 0.5em; padding: 0.15em 0; border-bottom: 1px solid #ccd; }
.mark { flex: 0 0 3.6em; text-align: center; border-radius: 8px; color: #fff; }
.mark.ok { background: #13804a; }
.mark.check { background: #c25e00; }
.mark.none { background: #8a8fa8; }
.ua { font-size: 13px; color: #555; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<div id="main"></div>
<script src="mictest.js"></script>
</body>
</html>
