# Checks every push and pull request.
#
# Safe for a public repository:
# - The checks job can only read the repository.
# - Pull requests use the `pull_request` trigger (never `pull_request_target`), so a stranger's pull request
#   runs with no write access and no secrets.
# - Third-party actions are pinned to an exact commit (the version is in the comment).
name: Checks and deploy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node tests/run.mjs
